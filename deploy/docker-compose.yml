# From the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
# Put your reverse proxy (Caddy / Traefik / nginx) in front of port 8090 for TLS.
services:
  ti-archive:
    build: { context: .., dockerfile: deploy/Dockerfile }
    container_name: ti-archive
    restart: unless-stopped
    ports: ["127.0.0.1:8090:80"]
